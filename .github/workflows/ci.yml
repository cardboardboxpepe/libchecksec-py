name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest==8.4.1 black==25.1.0
      - name: Smoke test installed package and CLI
        run: |
          python -c "import libchecksec; print(libchecksec.__name__)"
          libchecksec --help
      - name: Check fixtures are present
        run: python -c "from pathlib import Path; assert any(Path('tests/binaries').iterdir()), 'fixture submodule is empty'"
      - name: Check formatting
        run: python -m black --check --workers 1 libchecksec tests
      - name: Compile Python sources
        run: python -m compileall -q libchecksec tests
      - name: Run tests
        run: python -m pytest
      - name: Build distribution
        run: python -m pip wheel --no-deps --wheel-dir dist .

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install type checker and source dependencies
        run: python -m pip install -e . pytest==8.4.1 basedpyright==1.40.2 typing-extensions==4.15.0
      - name: Check source types
        run: basedpyright --warnings
      - name: Build and install wheel in isolated environment
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m venv "$RUNNER_TEMP/consumer-env"
          "$RUNNER_TEMP/consumer-env/bin/python" -m pip install "$RUNNER_TEMP"/wheels/*.whl typing-extensions==4.15.0
          cp tests/typecheck/*.py "$RUNNER_TEMP/"
          python -c 'import json, os; json.dump({"venvPath": os.environ["RUNNER_TEMP"], "venv": "consumer-env", "include": ["consumer.py"], "typeCheckingMode": "strict"}, open(os.path.join(os.environ["RUNNER_TEMP"], "pyrightconfig.json"), "w"))'
      - name: Verify installed package and consumer contracts
        working-directory: ${{ runner.temp }}
        run: |
          PATH="$RUNNER_TEMP/consumer-env/bin:$PATH" basedpyright --verifytypes libchecksec --ignoreexternal
          basedpyright --project pyrightconfig.json --warnings consumer.py
          "$RUNNER_TEMP/consumer-env/bin/python" check_invalid.py
