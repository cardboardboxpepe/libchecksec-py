[tool.poetry]
name = "libchecksec-py"
version = "0.11.4"
description = "Static binary security-property inspection using LIEF"
authors = ["Mathieu Tarral <mathieu.tarral@protonmail.com>"]
readme = "README.md"
packages = [{ include = "libchecksec" }]
license = "GPL-3.0-only"
repository = "https://github.com/cardboardboxpepe/libchecksec-py"
keywords = ["checksec", "security", "ELF", "PE", "binary"]

[tool.poetry.scripts]
libchecksec = "libchecksec.__main__:entrypoint"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
lief = "0.17.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.4.1"
basedpyright = "1.40.2"
typing-extensions = "4.15.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.basedpyright]
include = ["libchecksec", "tests"]
exclude = ["tests/typecheck/invalid.py"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
pythonPlatform = "All"
reportAny = "error"
reportExplicitAny = "error"
